plugins {
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.sonarqube' version '5.1.0.4882'
    id 'io.freefair.lombok' version '8.4'
}

ext {
    set('springCloudVersion', "2023.0.0")
}

configurations {
    all {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}

group = 'us.ampre'
version = '1.1.0'
description = 'Java Rets Client'
java.sourceCompatibility = JavaVersion.VERSION_17

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    implementation 'org.hibernate:hibernate-core:6.4.5.Final'

    implementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'

    implementation 'org.zalando:problem-spring-web:0.29.1'
    implementation 'org.zalando:jackson-datatype-problem:0.27.1'

    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

    implementation 'com.azure:azure-storage-blob:12.25.1'
    implementation 'com.azure.spring:spring-cloud-azure-starter-keyvault-secrets:5.7.0'
    implementation 'com.azure.spring:spring-cloud-azure-dependencies:5.7.0'

    implementation 'com.google.cloud:spring-cloud-gcp-starter:5.0.2'
    implementation 'com.google.cloud:spring-cloud-gcp-starter-secretmanager:5.0.2'

    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.736'

    implementation 'net.sf.supercsv:super-csv:2.4.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'com.google.guava:guava:33.0.0-jre'

    api 'jdom:jdom:1.1'
    api 'org.apache.httpcomponents.client5:httpclient5:5.4'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j:8.3.0'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5',
            'org.bouncycastle:bcprov-jdk15on:1.70',
            'io.jsonwebtoken:jjwt-jackson:0.12.5'

    //	developmentOnly 'org.springframework.boot:spring-boot-devtools'

    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'junit:junit:4.13.2'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}


test {
    useJUnitPlatform()
}

bootRun {
    systemProperty("spring.profiles.active", "local,creds")
    systemProperty("polyglot.engine.WarnInterpreterOnly", "false")
}

jar {
    enabled = false
}


gradle.projectsEvaluated {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:deprecation"
    }
}

springBoot {
    buildInfo()
}


repositories {
    // AMP Nexus Repos
    maven {
        url = 'https://nexus.dev.ampre.ca/repository/Shibboleth-Proxy/'
        credentials {
            username = nexusTokenUser
            password = nexusTokenPassword
        }
        authentication {
            basic(BasicAuthentication)
        }
    }
    maven {
        url = 'https://nexus.dev.ampre.ca/repository/maven-central/'
        credentials {
            username = nexusTokenUser
            password = nexusTokenPassword
        }
        authentication {
            basic(BasicAuthentication)
        }
    }
    maven {
        url = 'https://nexus.dev.ampre.ca/repository/AMP-Release-Maven/'
        credentials {
            username = nexusTokenUser
            password = nexusTokenPassword
        }
        authentication {
            basic(BasicAuthentication)
        }
    }
    maven {
        url = 'https://nexus.dev.ampre.ca/repository/AMP-Snapshot-Maven/'
        credentials {
            username = nexusTokenUser
            password = nexusTokenPassword
        }
        authentication {
            basic(BasicAuthentication)
        }
    }
    maven {
        url = 'https://nexus.dev.ampre.ca/repository/third-party/'
        credentials {
            username = nexusTokenUser
            password = nexusTokenPassword
        }
        authentication {
            basic(BasicAuthentication)
        }
    }
}

publishing {
    publications {
        javaretsclient(MavenPublication) {
            artifact bootJar
            from components.java
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
        }
    }

    repositories {
        maven {
            if (project.version.endsWith('-SNAPSHOT')) {
                url = 'https://nexus.dev.ampre.ca/repository/AMP-Snapshot-Maven/'
            } else {
                url = 'https://nexus.dev.ampre.ca/repository/AMP-Release-Maven/'
            }
            credentials {
                username = nexusTokenUser
                password = nexusTokenPassword
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

sonarqube {
    properties {
        property "sonar.projectKey", "AMPSystems_java-rets-client"
        property "sonar.organization", "ampsystems"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}